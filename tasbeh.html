<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasbeh</title>
<style>
body { font-family: Arial; background:#fefefe; margin:0; padding:0;}
header { background:#4CAF50; color:white; text-align:center; padding:1em; }
nav { display:flex; justify-content:center; background:#333; }
nav button { margin:0.5em; padding:0.5em 1em; color:white; background:#555; border:none; cursor:pointer; }
nav button:hover { background:#777; }
section { max-width:700px; margin:auto; padding:1em;}
.card { background:white; padding:1em; margin:1em 0; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.2);}
button { padding:0.5em 1em; font-size:16px; }
</style>
</head>
<body>

<header>
  <h1>📿 Tasbeh</h1>
</header>

<nav>
  <button onclick="location.href='index.html'">🏠 Bosh sahifa</button>
  <button onclick="location.href='duolar.html'">📿 Duolar</button>
  <button onclick="location.href='tasbeh.html'">📿 Tasbeh</button>
  <button onclick="location.href='amal.html'">🤍 Amallar</button>
</nav>

<section>
  <div class="card">
    <h2>Tasbeh sanagich (99)</h2>
    <p id="count">0</p>
    <button onclick="increment()">Bos</button>
    <button onclick="reset()">Reset</button>
  </div>
</section>

<script>
let count = 0;
function increment() {
  if(count<99) count++;
  document.getElementById("count").textContent = count;
}
function reset() {
  count = 0;
  document.getElementById("count").textContent = count;
}
</script>

</body>
</html>
